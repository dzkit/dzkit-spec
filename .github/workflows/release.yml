name: Release

# When a GitHub release is published, checks it and attaches the bundles to it:
#   dzkit-spec.json, vectors.json and SHA256SUMS
# so any language can download the exact files of a version, without Node or npm:
#   https://github.com/dzkit/dzkit-spec/releases/download/v0.2.0/dzkit-spec.json
#
# To attach the files to a release that already exists, run this workflow from the
# Actions tab and give the tag (for example v0.2.0).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true

permissions:
  contents: write # to upload files to the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the tag, package.json and CHANGELOG.md agree
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release tag is ${TAG} but package.json says ${version}. Update package.json and CHANGELOG.md in a pull request first, then create the release v${version}."
            exit 1
          fi
          if ! grep -q "^## ${version} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section."
            exit 1
          fi

      - run: npm ci

      - name: Validate rules, sources and test cases; check dist/ is up to date
        run: npm run check

      - name: Attach the bundles to the release
        run: |
          cd dist
          sha256sum dzkit-spec.json vectors.json > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" dzkit-spec.json vectors.json SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "Attached to [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}):"
            echo ""
            echo "- ${base}/dzkit-spec.json"
            echo "- ${base}/vectors.json"
            echo "- ${base}/SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"
