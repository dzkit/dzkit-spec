name: Links

# Checks every source link, including the Journal officiel PDFs on joradp.dz.
# Runs weekly and on demand; it never blocks a pull request, because official
# sites are sometimes slow or briefly offline.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: check
        run: node scripts/check-links.mjs | tee links.log
        continue-on-error: true
      - name: Open an issue when links are broken
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly link check found broken source links."
            echo
            echo '```'
            grep '✗' links.log || true
            echo '```'
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh issue create --title "Broken source links ($(date -u +%Y-%m-%d))" --body-file body.md
