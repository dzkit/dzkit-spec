id: business.nif-nis
title:
  fr: NIF et NIS
  ar: الرقم الجبائي والرقم الإحصائي
  en: Tax (NIF) and statistical (NIS) identification numbers
description: >
  No check-digit algorithm is published for either number, so implementations
  can only check the format (digits only, allowed lengths). Spaces, dots and
  dashes are commonly used as separators and should be ignored. To confirm a NIF
  exists, use the DGI portal.
review:
  every_months: 24
  triggers: [change to the NIF or NIS format, introduction of the national identification number for companies]
watch:
  fr: [numero d'identification fiscale, numero d'identification statistique]
  ar: [رقم التعريف الجبائي, رقم التعريف الإحصائي]
versions:
  - valid_from: null
    valid_to: null
    status: official
    sources:
      - { source: python-stdnum-nif, supports: NIF lengths }
      - { source: upgrowth-nif, supports: NIF lengths and absence of a check key }
      - { source: decret-executif-97-396, articles: ['4', '5'], supports: NIS lengths }
    data:
      nif:
        lengths: [15, 20]
        notes: 20 digits for a branch or secondary establishment.
        lookup_url: https://nifenligne.mf.gov.dz
      nis:
        lengths: [15, 18]
        notes: A secondary establishment adds a 3-digit sequence number to the main establishment's 15 digits.
      separators: [' ', '.', '-']
