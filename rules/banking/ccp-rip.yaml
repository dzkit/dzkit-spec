id: banking.ccp-rip
title:
  fr: CCP et RIP (Algérie Poste)
  ar: الحساب البريدي الجاري و RIP
  en: CCP account and RIP (Algérie Poste)
description: >
  A RIP has 20 digits: bank code 007, branch code 99999, the CCP account number
  left-padded to 10 digits, and a 2-digit key.

  RIP key = 97 − ((account × 100 + offset) mod 97), written on 2 digits. The result
  is always 01 to 97; 97 is a real key (when the remainder is 0).

  CCP key (written after the account number on cheques) = Σ digit × weight, mod 100,
  where weights run from 4 for the rightmost digit to 13 for the leftmost, on the
  10-digit padded account. Written on 2 digits.

  Algérie Poste does not publish these algorithms; they are confirmed against real
  RIP numbers (see vectors/rip.*.json).
versions:
