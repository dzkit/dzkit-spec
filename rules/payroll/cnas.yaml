id: payroll.cnas
title:
  fr: Cotisations de sécurité sociale (salariés)
  ar: اشتراكات الضمان الاجتماعي (الأجراء)
  en: Social security contributions (employees)
description: >
  Rates applied to the gross salary subject to contributions. `employer` and
  `employee` are totals; `branches` gives the breakdown. `social_services` is paid
  by the employer on top of `employer`. There is no ceiling for employees, and the
  base may not be lower than the minimum wage (see payroll.minimum-wage).
