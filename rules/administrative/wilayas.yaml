id: administrative.wilayas
title:
  fr: Wilayas
  ar: الولايات
  en: Provinces (wilayas)
description: >
  The official list of wilayas with their codes (also used on licence plates),
  French and Arabic names. Each entry may carry `valid_from` (first day it exists
  as a wilaya) and `parent` (code of the wilaya it was created from).
review:
  every_months: 12
  triggers: [new wilayas, renaming of a wilaya]
watch:
  fr: [organisation territoriale, noms et chefs-lieux des wilayas, wilaya deleguee]
  ar: [التنظيم الإقليمي, أسماء الولايات]
versions:
  - valid_from: 1984-02-04
    valid_to: null
    status: official
    sources:
      - { source: loi-84-09, supports: codes and names 1-48 }
      - { source: decret-84-79, supports: names and chefs-lieux }
      - { source: loi-19-12, supports: 'wilayas 49-58, from the wilayas they were created from' }
      - { source: decret-presidentiel-21-117, supports: names and chefs-lieux of 49-58 }
      - { source: loi-26-06, supports: the 69 wilayas }
      - { source: decret-presidentiel-26-206, supports: names and numbers of 59-69 }
      - { source: upgrowth-wilayas-2026, supports: cross-check of all names and parents of 59-69 }
      - { source: wikipedia-provinces, supports: cross-check of names 1-58 }
    notes: >
      The 48 wilayas of loi n° 84-09 exist since 1984 (earlier divisions are not recorded,
      so dates before 1984-02-04 have no version). Codes 49 to 58 exist since loi n° 19-12;
      their entries carry valid_from and parent. Codes 59 to 69 exist since loi n° 26-06 and were numbered by décret présidentiel
      n° 26-206. They exercise their full powers from 1 January 2027; until then
      their parent wilaya runs them. Plate codes 59 to 69 start on 1 January 2027
      (see vehicles.plates).
