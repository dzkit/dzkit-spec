# Every text or reference a rule relies on.
#
# kind:         one of the kinds in hierarchy.yaml (law, presidential-decree, arrete, ...)
# jo:           Journal officiel issue; the build generates links to the official PDFs on
#               joradp.dz, in Arabic (the authoritative edition) and French
# verification: how closely the source was checked
#   read: original  the source itself, in its authoritative form (JO PDF, the regulator's page)
#   read: copy      a faithful copy of the text hosted elsewhere
#   read: report    only reports about it (press, guides): the official text still needs opening
#
# Ids are permanent: never rename one or reuse it for another text.

